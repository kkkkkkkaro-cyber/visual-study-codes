<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="760" viewBox="0 0 1270 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6F3EC"/><stop offset="1" stop-color="#E9F0F1"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1B3340" flood-opacity=".10"/></filter>
</defs>
<rect width="1270" height="760" rx="30" fill="url(#bg)"/>
<text x="72" y="64" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#55716D">VISUAL STUDY CODES  /  /DECISION-MATRIX</text>
<text x="72" y="145" font-family="Arial,sans-serif" font-size="54" font-weight="800" fill="#17323B">Choose a study move</text>
<text x="74" y="190" font-family="Arial,sans-serif" font-size="24" fill="#587078">Match the technique to the job — not to a universal ranking.</text>
<rect x="72" y="235" width="1126" height="405" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
<rect x="96" y="260" width="1078" height="60" rx="12" fill="#17323B"/>
<text x="126" y="298" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#B8D8D0">METHOD</text>
<text x="390" y="298" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#B8D8D0">BEST WHEN…</text>
<text x="820" y="298" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#B8D8D0">TRY THIS</text>
<g font-family="Arial,sans-serif">
<rect x="96" y="332" width="1078" height="68" rx="10" fill="#E8F3EF"/>
<text x="126" y="374" font-size="22" font-weight="700" fill="#1F766D">Retrieval practice</text>
<text x="390" y="360" font-size="18" fill="#36535A">You need to remember or</text><text x="390" y="383" font-size="18" fill="#36535A">explain without prompts.</text>
<text x="820" y="360" font-size="18" fill="#36535A">Close notes; answer</text><text x="820" y="383" font-size="18" fill="#36535A">from memory; check gaps.</text>
<rect x="96" y="410" width="1078" height="68" rx="10" fill="#F8F0DF"/>
<text x="126" y="452" font-size="22" font-weight="700" fill="#A76D2C">Worked example</text>
<text x="390" y="438" font-size="18" fill="#36535A">You are new to a process</text><text x="390" y="461" font-size="18" fill="#36535A">or problem type.</text>
<text x="820" y="438" font-size="18" fill="#36535A">Study one solution,</text><text x="820" y="461" font-size="18" fill="#36535A">then solve a similar one.</text>
<rect x="96" y="488" width="1078" height="68" rx="10" fill="#ECECF8"/>
<text x="126" y="530" font-size="22" font-weight="700" fill="#6668A6">Spaced review</text>
<text x="390" y="516" font-size="18" fill="#36535A">You want to retain it</text><text x="390" y="539" font-size="18" fill="#36535A">beyond today's session.</text>
<text x="820" y="516" font-size="18" fill="#36535A">Revisit after a gap;</text><text x="820" y="539" font-size="18" fill="#36535A">increase gaps gradually.</text>
<rect x="96" y="566" width="1078" height="54" rx="10" fill="#F1F2F2"/>
<text x="126" y="601" font-size="22" font-weight="700" fill="#66757A">Rereading</text>
<text x="390" y="601" font-size="18" fill="#36535A">You need a first pass or quick orientation.</text>
<text x="820" y="601" font-size="18" fill="#36535A">Use it, then add active recall.</text>
</g>
<text x="72" y="684" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17323B">Rule of thumb</text>
<text x="72" y="713" font-family="Arial,sans-serif" font-size="18" fill="#587078">Use examples to learn a new method; retrieve and space practice to strengthen later recall.</text>
<text x="72" y="742" font-family="Arial,sans-serif" font-size="13" fill="#6C817F">SAMPLE OUTPUT · Dunlosky et al. (2013); Roediger &amp; Karpicke (2006)</text>
</svg>